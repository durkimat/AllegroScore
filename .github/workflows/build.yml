name: AllegroScore CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Linux Build & AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies (Qt 6 + linuxdeploy tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            qt6-base-dev qt6.declarative-dev qt6.websockets-dev \
            libxcb-xinerama0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-shm0-dev libxcb-util0-dev libxcb-keysyms1-dev \
            libpng-dev libjpeg-dev libpango1.0-dev \
            linuxdeploy linuxdeploy-plugin-qt appimagetool

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Package AppImage (linuxdeploy + qt plugin)
        run: |
          chmod +x scripts/package_appimage.sh
          bash scripts/package_appimage.sh

      - name: Verify AppImage runs (xvfb-run headless test)
        run: |
          if [ -f /artifacts/AllegroScore-x86_64.AppImage ]; then
            # Make executable and run headless
            chmod +x /artifacts/AllegroScore-x86_64.AppImage
            xvfb-run -a /artifacts/AllegroScore-x86_64-AppImage -platform offscreen || true
            # Also just check it's a valid AppImage
            file /artifacts/AllegroScore-x86_64.AppImage
          else
            echo "AppImage not generated; skipping test"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allegroscore-linux
          path: |
            /artifacts/AllegroScore-x86_64.AppImage
            /artifacts/

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 and MinGW
        uses: onereq/msys2-msvc-action@v1
        with:
          msys2-version: '3.19'

      - name: Install Qt 6 for MinGW
        run: |
          pacman -Sy --needed --noconfirm \
            mingw-w64-x86_64-qt6-base \
            mingw-w64-x86_64-qt6-declarative \
            mingw-w64-x86_64-qt6-websockets \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-make

      - name: Configure CMake (MinGW)
        run: |
          cmake -B build-win -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=~/msys64/usr/bin/x86_64-w64-mingw32.cmake-c++ -DCMAKE_MAKE_PROGRAM=~/msys64/usr/bin/x86_64-w64-mingw32.cmake-make

      - name: Build Windows executable
        run: |
          cmake --build build-win -j4

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: allegroscore-windows
          path: build-win/AllegroScore.exe

  build-macos:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (Homebrew)
        run: |
          brew update
          brew install qt6

      - name: Configure CMake
        run: |
          cmake -B build-mac -DCMAKE_BUILD_TYPE=Release

      - name: Build macOS executable
        run: |
          cmake --build build-mac -j$(nproc)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: allegroscore-macos
          path: build-mac/AllegroScore